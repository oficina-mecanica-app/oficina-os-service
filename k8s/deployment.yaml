apiVersion: apps/v1
kind: Deployment
metadata:
  name: os-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: os-service
  template:
    metadata:
      labels:
        app: os-service
    spec:
      containers:
      - name: os-service
        image: lucasscuissiatto/oficina-os-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres-service:5432/oficina_os"
        - name: SPRING_DATASOURCE_USERNAME
          value: "admin"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "admin_password"
        - name: SPRING_RABBITMQ_HOST
          value: "rabbitmq-service"
        - name: SPRING_MAIL_HOST
          value: "mailhog-service"
---
apiVersion: v1
kind: Service
metadata:
  name: os-service
spec:
  type: LoadBalancer
  selector:
    app: os-service
  ports:
  - port: 8080
    targetPort: 8080