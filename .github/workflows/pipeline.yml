name: Java CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean verify

      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn sonar:sonar -Dsonar.projectKey=oficina-mecanica-app_oficina-os-service -Dsonar.organization=oficina-mecanica-app -Dsonar.host.url=https://sonarcloud.io

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t lucasscuissiatto/oficina-os-service:latest .
          docker push lucasscuissiatto/oficina-os-service:latest

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.10.0

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml