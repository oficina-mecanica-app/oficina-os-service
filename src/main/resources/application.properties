spring.application.name=oficina-os-service
server.port=8080

# Conexão com o Postgres (Container docker-compose)
spring.datasource.url=jdbc:postgresql://localhost:5432/oficina_os
spring.datasource.username=admin
spring.datasource.password=admin_password
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin_password

api.security.token.secret=minha-chave-secreta-super-segura

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.tracing.sampling.probability=1.0
management.security.enabled=false

spring.mail.host=localhost
spring.mail.port=1025